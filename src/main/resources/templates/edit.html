<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark">
<div class="container mt-4">
    <h1 class="mt-5 text-white text-center mb-5">Update Student Info</h1>
    <div class="card shadow">
        <div class="card-body">
            <form th:action="@{/students/edit/{id} (id=${student.id})}" th:object="${student}" method="post">
                <div class="mt-4">
                    <label class="form-label">Name</label>
                    <input type="text" th:field="*{name}" class="form-control">
                </div>
                <div class="mt-4">
                    <label class="form-label">LastName</label>
                    <input type="text" th:field="*{lastName}" class="form-control">
                </div>
                <div class="mt-4">
                    <label class="form-label">Email</label>
                    <input type="text" th:field="*{email}" class="form-control">
                </div>
                <div class="mt-4">
                    <label class="form-label">PhoneNo</label>
                    <input type="text" th:field="*{phoneNo}" class="form-control">
                </div>
                <div class="mt-4">
                    <label class="form-label">Subject</label>
                    <input type="text" th:field="*{subject}" class="form-control">
                </div>
                <div class="mt-4 text-center" >
                    <button class="btn btn-primary " type="submit">Update Student</button>
                    <a th:href="@{/students}" class="btn btn-danger">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
