<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home-Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-dark">
<div class="container mt-4">
  <h1 class="mt-4 text-white text-center">Student Management System</h1>
  <div class="mt-4">
    <a th:href="@{/students/add}" class="btn btn-primary width-50 rounded"> Add Student </a>
  </div>
  <form th:action="@{/students/search}" method="get" class="row g-2 mb-4">
    <div class="col-md-8 mt-4">
      <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Search Student by Name">
    </div>
    <div class="col-md-2 mt-4">
      <button class="btn btn-primary w-100" type="submit">
        Search
      </button>
    </div>
    <div class="col-md-2 mt-4">
      <a th:href="@{/students}" class="btn btn-secondary  w-100">Clear</a>
    </div>
  </form>
  <div th:if="${searched and #lists.isEmpty(students)}" class="alert alert-warning">
        No Student Found .
  </div>

  <table class="table table-bordered table-striped mt-4 table-hover"
          th:unless="${#lists.isEmpty(students)}">
    <thead>
    <tr class="table-light">
      <th>Name</th>
      <th>LastName</th>
      <th>Email</th>
      <th>Subject</th>
      <th>PhoneNo</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
      <td th:text="${student.name}"></td>
      <td th:text="${student.lastName}"></td>
      <td th:text="${student.email}"></td>
      <td th:text="${student.subject}"></td>
      <td th:text="${student.phoneNo}"></td>
      <td class="text-center">
        <a th:href="@{/students/update/{id} (id=${student.id})}" class="btn btn-warning btn-sm text-center">Update</a>
      </td>
      <td class="text-center">
        <a th:href="@{/students/delete/{id} (id=${student.id})}" class="btn btn-danger btn-sm text-center">Delete</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
